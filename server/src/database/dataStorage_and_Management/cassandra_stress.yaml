keyspace: mentoriadbms
table: companies
table_definition: CREATE TABLE companies (
    company_id uuid PRIMARY KEY,
    cname text
    );
columnspec:
    - name: company_id
      size: fixed(16)
      population: seq(31..500030)
    - name: cname
      size: uniform(13..18)
      population: seq(31..500030)
insert:
    partitions: fixed(500)
    batchtype: UNLOGGED
queries:
    read1:
        cql: select * from users where companies = ? and company_id = ?
        fields: samerow
# bash: docker run --rm -v "${PWD}:/data" --network host cassandra:latest /opt/cassandra/tools/bin/cassandra-stress user profile=/data/server/src/database/cassandra_stress.yaml n=1000 "ops(insert=1)" no-warmup cl=ONE -rate threads=1000
